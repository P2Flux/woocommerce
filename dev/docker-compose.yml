# A WordPress + WooCommerce store to develop against.
#
# The plugin is bind-mounted, so an edit is live on the next request - no build step, no copy. The
# fixture mu-plugin is mounted separately and never leaves dev/: it can shorten billing periods,
# which is exactly what you want to watch two renewals in two minutes on Sepolia, and exactly what
# must never reach a real store.
#
#   docker compose -f dev/docker-compose.yml up -d
#   dev/setup.sh
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:6.7-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        /* Development only. On a real store this key belongs in wp-config.php and nowhere else. */
        define( 'P2FLUX_WC_ENCRYPTION_KEY', 'ZGV2ZWxvcG1lbnQta2V5LWRldmVsb3BtZW50LWtleTEy' );
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/p2flux-for-woocommerce
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    user: "33:33"
    entrypoint: ["sleep", "infinity"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/p2flux-for-woocommerce
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

volumes:
  db:
  wp:
